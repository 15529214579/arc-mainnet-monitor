name: Arc Mainnet Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send Telegram test only"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: read

concurrency:
  group: arc-mainnet-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Run monitor
        env:
          ARC_RPC_URL: ${{ secrets.ARC_RPC_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LOOKBACK_BLOCKS: "80"
          MAX_ALERTS: "12"
          TEST_ALERT: ${{ inputs.test_alert == true && '1' || '0' }}
        run: go run .
